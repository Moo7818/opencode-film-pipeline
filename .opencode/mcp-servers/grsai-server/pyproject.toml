[project]
name = "grsai-server"
version = "0.1.0"
description = "GRSAI MCP Server — 图像生成 / LLM 调用客户端"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.27.0,<2",
    "httpx",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
grsai-server = "grsai_server.server:main"