[project]
name = "grsai-server"
version = "0.1.0"
description = "GRSAI MCP Server — 图像生成 / LLM 调用客户端"
requires-python = ">=3.13"
dependencies = [
    # MCP SDK：主依赖；会间接拉取 pyjwt[crypto] → cryptography
    "mcp>=1.27.0,<2",
    # HTTP 客户端：纯 wheel，全平台稳定
    "httpx>=0.27.0,<0.29",
    "python-dotenv>=1.0.0,<2",
    # 关键：钉死有 multi-platform 预编译 wheel 的版本，避免源码编译
    # cryptography 49.x 仅有 macosx_11_0_arm64，无 Intel macOS x86_64 wheel
    # 48.0.0 提供 macosx_10_9_universal2 + manylinux + win_amd64 等
    "cryptography==48.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
grsai-server = "grsai_server.server:main"

# ---------------------------------------------------------------------------
# uv 配置：依赖全部落在本目录 .venv/，不污染用户全局环境
# 安装：在本目录执行 `uv sync`，或从仓库根执行 bootstrap 脚本
# 启动：opencode.json 使用
#   uv run --no-sync --directory .opencode/mcp-servers/grsai-server -m grsai_server
# ---------------------------------------------------------------------------
[tool.uv]
package = true
